<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Survivor V3.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:2px 2px #000}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:13px;gap:7px}
#bar{position:absolute;top:38px;left:12px;width:185px;height:14px;border:2px solid #111;background:#333}
#hp{height:100%;background:#e94b4b;width:100%}
#hpText{position:absolute;top:40px;left:18px;font-size:10px;font-weight:900}
#xpbar{position:absolute;top:57px;left:12px;width:185px;height:7px;background:#30343d;border:1px solid #111}
#xp{height:100%;width:0;background:#61d8ff}
#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;white-space:nowrap}
#stick{position:fixed;left:0;top:0;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:none;display:none;z-index:10}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff4;border:2px solid #fff6}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;pointer-events:auto;z-index:20;padding:18px}
#levelup h2{margin:0 0 5px;font-size:29px}
#choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
.choice{width:155px;padding:12px 8px;border:2px solid #fff5;border-radius:12px;background:#252b36;color:#fff;font-weight:900}
.choice small{display:block;margin-top:4px;font-weight:500;opacity:.72}
button{font-size:16px;font-weight:900;padding:11px 20px;border:0;border-radius:10px;background:#f2c14e;color:#111}
#gameover{z-index:30}.win{background:#07110de8}
#weaponList{font-size:11px;line-height:1.5;margin-top:5px;opacity:.85}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top"><span>LV <b id="lv">1</b></span><span>💎 <b id="gems">0</b></span><span>점수 <b id="score">0</b></span><span>⏱ <b id="time">0:00</b></span></div>
  <div id="bar"><div id="hp"></div></div><div id="hpText">100 / 100</div>
  <div id="xpbar"><div id="xp"></div></div>
  <div id="weaponList"></div>
  <div id="hint">화면 어디든 드래그 · 자동 공격</div>
</div>
<div id="stick"><div id="knob"></div></div>

<div id="levelup" class="overlay"><h2>LEVEL UP!</h2><p>무기 또는 능력을 선택하세요.</p><div id="choices"></div></div>

<div id="gameover" class="overlay"><h1 id="endTitle">GAME OVER</h1><p id="result"></p><button id="restart">다시 시작</button></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();

const S={maxHp:100,damage:12,monsterHp:20,contact:10,xpBase:40};
let player,enemies,shots,gems,drops,particles,texts,areaWarnings,score,level,xp,xpNeed,time,spawnTimer,shotTimer,nextBoss,paused,over,won,last,walkTime,killCount;
const joy={on:false,id:null,bx:0,by:0,x:0,y:0};
const weapons={
 blades:{name:'회전 칼날',lv:0,max:5,evo:false,count:3,damage:18,rate:.22,range:58,size:1,cool:0},
 missile:{name:'폭발 미사일',lv:0,max:5,evo:false,count:1,damage:18,rate:1.45,range:300,size:1,cool:0},
 sonic:{name:'음파 공격',lv:0,max:5,evo:false,count:1,damage:24,rate:2.0,range:78,size:1,cool:0},
 lightning:{name:'번개 공격',lv:0,max:5,evo:false,count:1,damage:34,rate:2.35,range:300,size:1,cool:0},
};
let stats={damagePct:0,attackSpeedPct:0,weaponRangePct:0,weaponSizePct:0};

const types=[
 {name:'slime',at:0,hp:1.0,speed:42,r:10,damage:1.0,xp:10,color:'#67d34f'},
 {name:'bat',at:90,hp:2.0,speed:62,r:11,damage:1.25,xp:18,color:'#7b55c7'},
 {name:'goblin',at:210,hp:4.0,speed:48,r:13,damage:1.6,xp:30,color:'#4fa84b'},
 {name:'skeleton',at:360,hp:7.5,speed:54,r:14,damage:2.1,xp:48,color:'#e8dfc5'},
 {name:'ogre',at:480,hp:15.0,speed:30,r:19,damage:3.2,xp:85,color:'#b45a43'},
];
function unlockedTypes(){return types.filter(t=>time>=t.at&&time<480||t.name==='slime'&&time<480)}
function chooseType(){
 const pool=types.filter(t=>time>=t.at);
 if(!pool.length)return types[0];
 // Newer monsters become more common as time passes; by 8:00 only the latest tier remains.
 const weights=pool.map((t,i)=>{
   if(time>=480)return i===pool.length-1?1:0;
   const next=types[i+1]?.at||480;
   const progress=Math.max(0,Math.min(1,(time-t.at)/(next-t.at)));
   return i===pool.length-1 ? 1.5 : Math.max(.04,1-progress*1.05);
 });
 let sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;
 for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
 return pool[pool.length-1];
}
function reset(){
 player={x:0,y:0,r:12,hp:S.maxHp,maxHp:S.maxHp,speed:185,damage:S.damage,fireRate:.43,bulletSpeed:360,aimX:1,aimY:0,inv:0};
 enemies=[];shots=[];gems=[];drops=[];particles=[];texts=[];areaWarnings=[];
 score=0;level=1;xp=0;xpNeed=S.xpBase;time=0;spawnTimer=.4;shotTimer=.1;nextBoss=90;paused=false;over=false;won=false;last=performance.now();walkTime=0;killCount=0;
 for(const w of Object.values(weapons)){w.lv=0;w.evo=false}
 stats={damagePct:0,attackSpeedPct:0,weaponRangePct:0,weaponSizePct:0};
 document.getElementById('gameover').style.display='none';document.getElementById('levelup').style.display='none';document.getElementById('settings').style.display='none';
 updateWeaponsUI();requestAnimationFrame(loop);
}
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,d=Math.max(W,H)/2+55;const t=chooseType();
 const difficulty=1+time/360; // gentle global growth in addition to new tiers
 const hp=S.monsterHp*t.hp*difficulty;
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:t.r,hp,max:hp,speed:t.speed+Math.min(28,level),type:t.name,contact:S.contact*t.damage*(1+time/600),xp:t.xp,phase:Math.random()*6.28,boss:false,color:t.color});
}
function boss(kind){
 const names=['Crimson Brute','Azure Warden','Violet Reaper','Golden Titan','Final Overlord'];
 const a=Math.random()*6.28,d=Math.max(W,H)/2+100;
 const k=Math.min(kind,4),hp=S.monsterHp*(10+k*2.5);
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:25+k*2,hp,max:hp,speed:28+k*5,type:'boss'+k,contact:S.contact*2.2,xp:35+k*8,phase:0,boss:true,bossIndex:k,name:names[k],attackCd:2.5});
}
function fireGun(){
 let t=null,b=Infinity;for(const e of enemies){if(e.hp<=0)continue;let d=(e.x-player.x)**2+(e.y-player.y)**2;if(d<b){b=d;t=e}}
 if(!t)return;let dx=t.x-player.x,dy=t.y-player.y,l=Math.hypot(dx,dy)||1;player.aimX=dx/l;player.aimY=dy/l;
 shots.push({x:player.x+player.aimX*17,y:player.y+player.aimY*17,vx:player.aimX*player.bulletSpeed,vy:player.aimY*player.bulletSpeed,r:4,life:1.3,damage:player.damage*(1+stats.damagePct)});
}
function addText(x,y,n){texts.push({x,y,n,age:0})}
function burst(x,y,n=6){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=25+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4})}}
function addXP(n){xp+=n;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.floor(S.xpBase*Math.pow(1.5,level-1));paused=true;showLevelUp();break}}
function availableChoices(){
 const arr=[];
 for(const [id,w] of Object.entries(weapons))if(w.lv<w.max||!w.evo)arr.push({id,title:w.lv?`${w.name} 강화 ${w.lv+1}`:w.name,desc:w.lv?`레벨 ${w.lv} → ${w.lv+1}`:'새 무기 획득'});
 arr.push({id:'damage',title:'공격력 +10%',desc:'총 포함 모든 공격'});
 arr.push({id:'speed',title:'공격속도 +10%',desc:'총 포함 모든 공격'});
 arr.push({id:'range',title:'공격범위 +10%',desc:'총 제외 모든 무기'});
 arr.push({id:'size',title:'무기 크기 +10%',desc:'총 제외 모든 무기'});
 return arr.sort(()=>Math.random()-.5).slice(0,4);
}
function showLevelUp(){
 const box=document.getElementById('choices');box.innerHTML='';
 for(const o of availableChoices()){
  const b=document.createElement('button');b.className='choice';b.innerHTML=o.title+'<small>'+o.desc+'</small>';
  b.onclick=()=>{applyChoice(o.id);document.getElementById('levelup').style.display='none';paused=false;last=performance.now();requestAnimationFrame(loop)};box.appendChild(b)
 }
 document.getElementById('levelup').style.display='flex';
}
function applyChoice(id){
 if(weapons[id]){
  const w=weapons[id];
  if(w.lv<w.max){
   w.lv++;
   if(id==='blades') w.count=2+w.lv; // 3→7
   if(id==='missile') w.count=1+Math.floor((w.lv-1)/2); // 1→3
   if(id==='sonic') w.count=1+Math.floor(w.lv/2);
   if(id==='lightning') w.count=1+Math.floor(w.lv/2);
   if(w.lv===5){w.evo=true;w.count+=2;w.rate*=.72;}
  }
 }else if(id==='damage')stats.damagePct+=.10;
 else if(id==='speed'){stats.attackSpeedPct+=.10;player.fireRate=Math.max(.08,player.fireRate*.9)}
 else if(id==='range')stats.weaponRangePct+=.10;
 else if(id==='size')stats.weaponSizePct+=.10;
 updateWeaponsUI();
}
function updateWeaponsUI(){
 const a=Object.values(weapons).filter(w=>w.lv>0).map(w=>`${w.name} Lv.${w.lv}${w.evo?'★':''}`);
 document.getElementById('weaponList').textContent=a.join(' · ');
}
function drop(x,y,type){drops.push({x,y,type,r:11,bob:Math.random()*6.28})}
function kill(e,source='normal'){
 if(e.hp>0 || e.dead)return;
 e.dead=true;
 score+=e.boss?250:10;killCount++;gems.push({x:e.x,y:e.y,r:6,xp:e.xp*(e.boss?1.35:1)});
 if(e.boss){drop(e.x-14,e.y,'bomb');drop(e.x+14,e.y,'magnet')}
 else if(Math.random()<.05)drop(e.x,e.y,['bomb','magnet','heal'][Math.floor(Math.random()*3)]);
 burst(e.x,e.y,e.boss?25:8);
}
function collectDrop(d){
 if(d.type==='bomb'){for(const e of enemies)if(e.hp>0){if(e.boss)e.hp*=.95;else{e.hp=0;gems.push({x:e.x,y:e.y,r:6,xp:e.xp});kill(e,'bomb')}}}
 if(d.type==='magnet'){for(const g of gems)g.boost=5000}
 if(d.type==='heal')player.hp=Math.min(player.maxHp,player.hp+15)
}
function weaponUpdate(dt){
 const rangeBonus=1+stats.weaponRangePct,sizeBonus=1+stats.weaponSizePct,damageBonus=1+stats.damagePct;
 for(const id of Object.keys(weapons)) weapons[id].cool-=dt;
 const w=weapons.blades;
 if(w.lv){
   const ang=time*2.7,rad=w.range*rangeBonus;
   for(let i=0;i<w.count;i++){
     const a=ang+i*6.28/w.count,x=player.x+Math.cos(a)*rad,y=player.y+Math.sin(a)*rad,r=9*sizeBonus;
     if(w.cool<=0)for(const e of enemies)if(e.hp>0&&!e.dead&&Math.hypot(e.x-x,e.y-y)<e.r+r){e.hp-=w.damage*damageBonus;addText(e.x,e.y-e.r,w.damage.toFixed(0));}
   }
   if(w.cool<=0)w.cool=w.rate;
 }
 const m=weapons.missile;
 if(m.lv&&m.cool<=0){for(let i=0;i<m.count;i++)fireMissile(m);m.cool=Math.max(.45,m.rate*(1-stats.attackSpeedPct));}
 const so=weapons.sonic;if(so.lv&&so.cool<=0){sonic();so.cool=Math.max(.55,so.rate*(1-stats.attackSpeedPct));}
 const li=weapons.lightning;if(li.lv&&li.cool<=0){lightning();li.cool=Math.max(.7,li.rate*(1-stats.attackSpeedPct));}
}
function fireMissile(w){let t=enemies.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(!t)return;let a=Math.atan2(t.y-player.y,t.x-player.x);shots.push({x:player.x,y:player.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:6,life:3,damage:w.damage*(1+stats.damagePct),homing:true})}
function sonic(){let w=weapons.sonic,rad=w.range*(1+stats.weaponRangePct);burst(player.x,player.y,10);for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<rad){e.hp-=w.damage*(1+stats.damagePct);addText(e.x,e.y-e.r,w.damage)}}
function lightning(){
 const w=weapons.lightning,targets=enemies.filter(e=>e.hp>0&&!e.dead).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y)).slice(0,w.count);
 for(const e of targets){const r=32*(1+stats.weaponRangePct); // telegraph and strike are nearly simultaneous
   areaWarnings.push({x:e.x,y:e.y,r,t:.08,damage:w.damage*(1+stats.damagePct),lightning:true});
 }
}
function updateUI(){
 lv.textContent=level;scoreEl.textContent=score;timeEl.textContent=`${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')}`;hp.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';hpText.textContent=`${Math.max(0,Math.ceil(player.hp))} / ${Math.ceil(player.maxHp)}`;xpEl.style.width=Math.min(100,xp/xpNeed*100)+'%';gemsEl.textContent=Math.floor(xp/10)
}
const lv=document.getElementById('lv'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),hp=document.getElementById('hp'),hpText=document.getElementById('hpText'),xpEl=document.getElementById('xp'),gemsEl=document.getElementById('gems');
function drawPlayer(){ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));let moving=joy.on&&(Math.abs(joy.x)+Math.abs(joy.y)>.04),bob=moving?Math.sin(walkTime)*1.4:0,leg=moving?Math.sin(walkTime)*3:0;ctx.fillStyle='#0008';ctx.fillRect(-10,9,20,4);ctx.fillStyle='#315d86';ctx.fillRect(-7+leg,5,5,7);ctx.fillRect(2-leg,5,5,7);ctx.fillStyle='#4c9ee8';ctx.fillRect(-11,-9+bob,22,16);ctx.fillStyle='#f3d19f';ctx.fillRect(-7,-15+bob,14,9);ctx.fillStyle='#20242a';ctx.fillRect((player.aimX>=0?5:-9),-12+bob,4,3);ctx.save();ctx.rotate(Math.atan2(player.aimY,player.aimX));ctx.fillStyle='#d9dde3';ctx.fillRect(6,-2,14,5);ctx.fillStyle='#555b65';ctx.fillRect(8,3,5,4);ctx.restore();ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));if(e.boss){const cols=['#a93445','#3872b9','#7543a9','#c4922e','#b83a2d'];ctx.fillStyle=cols[e.bossIndex];ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);ctx.fillStyle='#fff';ctx.fillRect(-9,-5,5,5);ctx.fillRect(4,-5,5,5);ctx.fillStyle='#222';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(e.name,0,-e.r-12);ctx.fillStyle='#222';ctx.fillRect(-35,-e.r-8,70,5);ctx.fillStyle='#e34b5a';ctx.fillRect(-35,-e.r-8,70*Math.max(0,e.hp/e.max),5)}else{
 if(e.type==='slime'){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,2,e.r,Math.PI,0);ctx.lineTo(e.r,8);ctx.quadraticCurveTo(0,14,-e.r,8);ctx.closePath();ctx.fill()}
 else if(e.type==='bat'){ctx.fillStyle=e.color;ctx.fillRect(-5,-4,10,12);ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-e.r-5,-7);ctx.lineTo(-e.r+1,7);ctx.fill();ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(e.r+5,-7);ctx.lineTo(e.r-1,7);ctx.fill()}
 else if(e.type==='goblin'){ctx.fillStyle=e.color;ctx.fillRect(-e.r+2,-e.r,e.r*2-4,e.r*2);ctx.beginPath();ctx.moveTo(-e.r+2,-7);ctx.lineTo(-e.r-5,-12);ctx.lineTo(-e.r+1,-2);ctx.fill();ctx.beginPath();ctx.moveTo(e.r-2,-7);ctx.lineTo(e.r+5,-12);ctx.lineTo(e.r-1,-2);ctx.fill()}
 else if(e.type==='skeleton'){ctx.fillStyle=e.color;ctx.fillRect(-9,-11,18,11);ctx.fillRect(-8,1,16,13);ctx.fillStyle='#252936';ctx.fillRect(-5,-7,3,4);ctx.fillRect(2,-7,3,4)}
 else if(e.type==='ogre'){ctx.fillStyle=e.color;ctx.fillRect(-e.r,-e.r+3,e.r*2,e.r*2-3);ctx.fillRect(-e.r-5,-4,5,10);ctx.fillRect(e.r,-4,5,10);ctx.fillStyle='#f2d7a0';ctx.fillRect(-9,-3,5,5);ctx.fillRect(4,-3,5,5)}
 }ctx.restore()}
function draw(){ctx.fillStyle='#171b24';ctx.fillRect(0,0,W,H);const camX=player.x-W/2,camY=player.y-H/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#202632';for(let x=Math.floor(camX/32)*32;x<camX+W+32;x+=32)ctx.fillRect(x,camY,1,H);for(let y=Math.floor(camY/32)*32;y<camY+H+32;y+=32)ctx.fillRect(camX,y,W,1);for(const a of areaWarnings){ctx.globalAlpha=.25;ctx.fillStyle='#ff4455';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ff6677';ctx.stroke()}for(const g of gems){
 const col=g.xp>=70?'#ff3b30':g.xp>=40?'#ff8c24':g.xp>=20?'#ffd52a':'#62d9ff';
 ctx.save();ctx.translate(g.x,g.y);ctx.rotate(.785);ctx.fillStyle=col;ctx.fillRect(-5,-5,10,10);ctx.restore();
}for(const d of drops){const yy=d.y+Math.sin(d.bob)*2;ctx.save();ctx.translate(d.x,yy);if(d.type==='bomb'){ctx.fillStyle='#e63e45';ctx.beginPath();ctx.arc(0,2,9,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-2,-11,4,4);ctx.fillStyle='#ffd34e';ctx.fillRect(2,-13,5,3)}else if(d.type==='magnet'){ctx.strokeStyle='#4b8dff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI);ctx.stroke();ctx.fillStyle='#ef4444';ctx.fillRect(-10,-2,4,8);ctx.fillRect(6,-2,4,8)}else{ctx.fillStyle='#fff';ctx.fillRect(-8,-8,16,16);ctx.fillStyle='#e34b5a';ctx.fillRect(-2,-7,4,14);ctx.fillRect(-7,-2,14,4)}ctx.restore()}if(weapons.blades.lv){const w=weapons.blades,rad=w.range*(1+stats.weaponRangePct),ang=time*2.7;for(let i=0;i<w.count;i++){const a=ang+i*6.28/w.count,x=player.x+Math.cos(a)*rad,y=player.y+Math.sin(a)*rad;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=w.evo?'#ffdc4a':'#dfe7f2';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-4);ctx.lineTo(-3,0);ctx.lineTo(-7,4);ctx.closePath();ctx.fill();ctx.restore()}}
for(const a of areaWarnings)if(a.lightning&&a.t<=.08){ctx.strokeStyle='#e8f7ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x-8,a.y-75);ctx.lineTo(a.x+4,a.y-35);ctx.lineTo(a.x-3,a.y-18);ctx.lineTo(a.x+7,a.y);ctx.stroke();}
for(const e of enemies)drawEnemy(e);for(const s of shots){ctx.fillStyle=s.homing?'#b97cff':'#f2c14e';ctx.fillRect(s.x-4,s.y-2,8,4)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.4);ctx.fillStyle='#f2c14e';ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.max(0,1-t.age/1);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(t.n,t.x,t.y)}ctx.globalAlpha=1;drawPlayer();ctx.restore()}
function loop(t){if(over||paused)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
function joyMove(e){let x=e.clientX-joy.bx,y=e.clientY-joy.by,d=Math.hypot(x,y),m=42;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`}
function begin(e){if(paused||over||e.target.closest('button,.overlay'))return;joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';stick.style.display='block';joyMove(e)}
function end(e){if(!joy.on||e.pointerId!==joy.id)return;joy.on=false;joy.x=joy.y=0;stick.style.display='none';knob.style.transform='translate(0,0)'}
c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',e=>joy.on&&e.pointerId===joy.id&&joyMove(e));c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
document.getElementById('restart').onclick=()=>{document.getElementById('gameover').classList.remove('win');reset()};
reset();
</script>
