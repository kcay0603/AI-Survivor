<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Survivor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:2px 2px #000}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;padding-right:48px;display:flex;justify-content:space-between;font-weight:900;font-size:13px;gap:7px}
#bar{position:absolute;top:38px;left:12px;width:185px;height:14px;border:2px solid #111;background:#333}
#hp{height:100%;background:#e94b4b;width:100%}
#hpText{position:absolute;top:40px;left:18px;font-size:10px;font-weight:900}
#xpbar{position:absolute;top:57px;left:12px;width:185px;height:7px;background:#30343d;border:1px solid #111}
#xp{height:100%;width:0;background:#61d8ff}
#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;white-space:nowrap}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;width:38px;height:38px;padding:0;border-radius:10px;background:#ffffff22;color:#fff;border:1px solid #fff5;font-size:18px;pointer-events:auto;z-index:15}
#stick{position:fixed;left:0;top:0;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:none;display:none;z-index:10}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff4;border:2px solid #fff6}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;pointer-events:auto;z-index:20;padding:18px}
#levelup h2{margin:0 0 5px;font-size:29px}
#chestReward h2{margin:0 0 8px;font-size:28px}
#chestRewards{min-width:220px;max-width:320px;margin:8px 0 14px;padding:10px 14px;border-radius:12px;background:#252b36;border:2px solid #ffd84d}
#choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
.choice{width:155px;padding:12px 8px;border:2px solid #fff5;border-radius:12px;background:#252b36;color:#fff;font-weight:900}
.choice small{display:block;margin-top:4px;font-weight:500;opacity:.72}
button{font-size:16px;font-weight:900;padding:11px 20px;border:0;border-radius:10px;background:#f2c14e;color:#111}
#gameover{z-index:30}.win{background:#07110de8}.damageRow{display:flex;justify-content:space-between;margin:5px 0;font-size:13px}
#weaponList,#supportList{display:none}
#pausePanel{z-index:25}
#pausePanel h2{margin:0 0 14px;font-size:30px}
#pausePanel .pauseBox{width:min(340px,90vw);padding:16px;border-radius:14px;background:#252b36;border:1px solid #fff3;text-align:left}
#pausePanel .pauseTitle{font-size:12px;font-weight:900;opacity:.7;margin:8px 0 5px}
#pausePanel .pauseList{font-size:14px;line-height:1.8;word-break:keep-all}
#levelup .sub{margin:0 0 8px;font-size:12px;opacity:.75}
.choice{position:relative;min-height:112px}
.choice .stars{display:block;text-align:center;font-size:18px;letter-spacing:1px;line-height:20px;margin-bottom:3px;color:#ffd84d}
.choice .tag{display:inline-block;font-size:9px;padding:2px 5px;border-radius:6px;background:#151a22;opacity:.8;margin-bottom:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="pauseBtn" aria-label="일시정지">Ⅱ</button>
  <div id="top"><span>LV <b id="lv">1</b></span><span>💎 <b id="gems">0</b></span><span>⏱ <b id="time">0:00</b></span></div>
  <div id="bar"><div id="hp"></div></div><div id="hpText">100 / 100</div>
  <div id="xpbar"><div id="xp"></div></div>
  <div id="weaponList"></div><div id="supportList"></div>
  <div id="hint">화면 어디든 드래그 · 자동 공격</div>
</div>
<div id="stick"><div id="knob"></div></div>

<div id="pausePanel" class="overlay">
  <h2>일시정지</h2>
  <div class="pauseBox">
    <div class="pauseTitle">메인 무기</div>
    <div id="pauseWeaponList" class="pauseList">없음</div>
    <div class="pauseTitle">보조 무기</div>
    <div id="pauseSupportList" class="pauseList">없음</div>
  </div>
  <button id="resumeBtn" style="margin-top:16px">계속하기</button>
</div>

<div id="chestReward" class="overlay"><h2>🎁 보물상자</h2><p class="sub">보물상자의 힘으로 다음 항목이 강화되었습니다.</p><div id="chestRewards"></div><button id="closeChest">확인</button></div>

<div id="levelup" class="overlay"><h2>LEVEL UP!</h2><p class="sub">무기 또는 보조무기를 선택하세요.</p><div id="choices"></div></div>

<div id="gameover" class="overlay"><h1 id="endTitle">GAME OVER</h1><p id="result"></p><div id="damageResult" style="margin:10px 0 18px;min-width:250px;max-width:340px;padding:12px;border-radius:12px;background:#252b36;border:1px solid #fff3;text-align:left"></div><button id="restart">메인 화면</button></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();

const S={maxHp:100,damage:12,monsterHp:20,contact:10,xpBase:40};
let player=null,enemies=[],shots=[],gems=[],drops=[],particles=[],texts=[],areaWarnings=[],areas=[],score=0,level=1,xp=0,xpNeed=S.xpBase,time=0,animTime=0,spawnTimer=0,shotTimer=0,nextBoss=90,paused=true,over=false,won=false,last=0,walkTime=0,killCount=0,chestPaused=false,finalBossDefeated=false,gameStarted=false;
const joy={on:false,id:null,bx:0,by:0,x:0,y:0};
let lightningSeq=[];
let enemyGrid=new Map();
const GRID_CELL=96;
function gridKey(gx,gy){return gx+','+gy}
function rebuildEnemyGrid(){
  enemyGrid.clear();
  for(const e of enemies){
    if(e.hp<=0) continue;
    const gx=Math.floor(e.x/GRID_CELL), gy=Math.floor(e.y/GRID_CELL), key=gridKey(gx,gy);
    let a=enemyGrid.get(key); if(!a){a=[];enemyGrid.set(key,a)}
    a.push(e);
  }
}
function queryEnemies(x,y,r){
  const out=[]; const rr=r*r;
  const minX=Math.floor((x-r)/GRID_CELL), maxX=Math.floor((x+r)/GRID_CELL);
  const minY=Math.floor((y-r)/GRID_CELL), maxY=Math.floor((y+r)/GRID_CELL);
  for(let gx=minX;gx<=maxX;gx++) for(let gy=minY;gy<=maxY;gy++){
    const a=enemyGrid.get(gridKey(gx,gy)); if(!a) continue;
    for(const e of a){ if(e.hp<=0) continue; const dx=e.x-x,dy=e.y-y; if(dx*dx+dy*dy<=rr) out.push(e); }
  }
  return out;
}
function isVisible(e){return e.x>=player.x-W/2 && e.x<=player.x+W/2 && e.y>=player.y-H/2 && e.y<=player.y+H/2}

let damageTotals={kunai:0,blades:0,lightning:0,rocket:0,fire:0,drill:0};
const weapons={
 kunai:{name:'쿠나이',lv:1,max:5,evo:false,count:1,damage:20,range:350,cooldown:.3,cool:0,pierce:0,baseDamage:20},
 blades:{name:'수호자',lv:0,max:5,evo:false,count:0,damage:35,range:100,duration:6,cooldown:9,cool:0,active:0,phase:0},
 lightning:{name:'번개 발사기',lv:0,max:5,evo:false,count:0,damage:68,range:300,cooldown:4,cool:0},
 rocket:{name:'로켓',lv:0,max:5,evo:false,count:0,damage:46,range:300,cooldown:3.5,cool:0},
 fire:{name:'화염병',lv:0,max:5,evo:false,count:0,damage:14,range:180,duration:4,cooldown:8,cool:0},
 drill:{name:'드릴샷',lv:0,max:5,evo:false,count:0,damage:22,range:Infinity,cooldown:2.5,cool:0}
};
const supports={
 fuel:{name:'고성능 연료',lv:0,max:5,desc:'모든 무기 범위 +10%'},
 ammo:{name:'고화력 탄약',lv:0,max:5,desc:'모든 무기 공격력 +10%'},
 scroll:{name:'닌자 스크롤',lv:0,max:5,desc:'EXP 획득량 +8%'},
 armor:{name:'부랑자의 갑옷',lv:0,max:5,desc:'받는 피해 -10%'},
 drink:{name:'에너지 드링크',lv:0,max:5,desc:'5초마다 최대 HP의 1% 회복'},
 cube:{name:'에너지 큐브',lv:0,max:5,desc:'모든 무기 쿨타임 -8%'},
 exo:{name:'외골격 갑옷',lv:0,max:5,desc:'지속형 무기 효과시간 +10%'},
 shoes:{name:'러닝화',lv:0,max:5,desc:'이동속도 +10%'},
 thruster:{name:'탄약 추진기',lv:0,max:5,desc:'투사체 속도 +10%'},
 fitness:{name:'피트니스 안내서',lv:0,max:5,desc:'최대 HP +20%, 증가분 회복'},
 magnet:{name:'탄력 자석',lv:0,max:3,desc:'아이템 획득 범위 +100%'}
};
let stats={damagePct:0,weaponRangePct:0,weaponSizePct:0,xpPct:0,damageReducePct:0,movePct:0,projectileSpeedPct:0,magnetPct:0,attackSpeedPct:0};
let healTimer=5;

const types=[
 {name:'slime',at:0,hp:1,speed:42,r:10,damage:1,xp:10,color:'#58d04b'},
 {name:'bat',at:120,hp:2.2,speed:63,r:11,damage:1.35,xp:20,color:'#8a55c7'},
 {name:'goblin',at:240,hp:4.5,speed:49,r:13,damage:1.75,xp:34,color:'#4fae50'},
 {name:'skeleton',at:360,hp:8,speed:53,r:14,damage:2.3,xp:52,color:'#e8dfc5'},
 {name:'ogre',at:480,hp:17,speed:29,r:20,damage:3.5,xp:90,color:'#b75b43'}
];
function unlockedTypes(){return types.filter(t=>time>=t.at)}
function chooseType(){
 const pool=types.filter(t=>time>=t.at);
 if(pool.length===1)return pool[0];
 const weights=pool.map((t,i)=>{
   const next=types[i+1]?.at ?? 540;
   const progress=Math.max(0,Math.min(1,(time-t.at)/Math.max(1,next-t.at)));
   return i===pool.length-1?1.9:Math.max(.03,1.15-progress*1.1);
 });
 if(time>=480)return pool[pool.length-1];
 let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;
 for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
 return pool[pool.length-1];
}

function reset(){
 player={x:0,y:0,r:12,hp:S.maxHp,maxHp:S.maxHp,speed:185,damage:S.damage,fireRate:.43,bulletSpeed:360,aimX:1,aimY:0,inv:0};
 enemies=[];shots=[];gems=[];drops=[];particles=[];texts=[];areaWarnings=[];areas=[];
 score=0;level=1;xp=0;xpNeed=S.xpBase;damageTotals={kunai:0,blades:0,lightning:0,rocket:0,fire:0,drill:0};time=0;finalBossDefeated=false;animTime=0;spawnTimer=.4;shotTimer=.1;nextBoss=90;paused=false;over=false;won=false;last=performance.now();walkTime=0;killCount=0;chestPaused=false;
 for(const w of Object.values(weapons)){w.lv=w===weapons.kunai?1:0;w.evo=false;w.count=w===weapons.kunai?1:0;w.cool=0;w.active=0;w.pierce=w===weapons.kunai?0:undefined}
 for(const s of Object.values(supports))s.lv=0;
 stats={damagePct:0,weaponRangePct:0,weaponSizePct:0,xpPct:0,damageReducePct:0,movePct:0,projectileSpeedPct:0,magnetPct:0,attackSpeedPct:0};
 lightningSeq=[];
 healTimer=5;
 document.getElementById('gameover').style.display='none';document.getElementById('levelup').style.display='none';document.getElementById('chestReward').style.display='none';document.getElementById('pausePanel').style.display='none';document.getElementById('pauseBtn').textContent='Ⅱ';
updateWeaponsUI();
}
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,d=Math.max(W,H)/2+55;const t=chooseType();
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:t.r,hp:S.monsterHp*t.hp,max:S.monsterHp*t.hp,speed:t.speed+Math.min(35,level*1.5),type:t.name,contact:S.contact*t.damage, xp:t.xp,phase:Math.random()*6.28,boss:false});
}
function boss(kind,isFinal=false){
 const names=['Crimson Brute','Azure Warden','Violet Reaper','Golden Titan','Final Overlord'];
 const hpByBoss=[1000,2500,4000,6000,8000];
 const k=Math.min(kind,4);
 const a=Math.random()*6.28,d=(k===4?Math.max(70,Math.min(W,H)/2-48):Math.max(W,H)/2+100);
 const hp=isFinal?14000:hpByBoss[k];
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:25+k*2,hp,max:hp,speed:28+k*5,type:'boss'+k,contact:S.contact*2.2,xp:35+k*8,phase:0,boss:true,bossIndex:k,name:names[k],attackCd:2.5,finalBoss:isFinal});
}
function fireGun(){
 const w=weapons.kunai;
 const baseRange=350;
 let t=null,b=baseRange*baseRange;
 for(const e of queryEnemies(player.x,player.y,baseRange)){const dx=e.x-player.x,dy=e.y-player.y,d=dx*dx+dy*dy;if(d<=b){b=d;t=e}}
 if(!t)return;
 const dx=t.x-player.x,dy=t.y-player.y,l=Math.hypot(dx,dy)||1;
 player.aimX=dx/l;player.aimY=dy/l;
 const speed=player.bulletSpeed*(1+stats.projectileSpeedPct);
 const size=w.lv>=5?1.25:1;
 shots.push({x:player.x+player.aimX*17,y:player.y+player.aimY*17,vx:player.aimX*speed,vy:player.aimY*speed,r:4*size,life:baseRange/speed,damage:w.baseDamage*(1+stats.damagePct),basicGun:true,pierce:Math.max(0,w.lv-1),hit:new Set()});
}

function dealWeaponDamage(e,amount,weaponId,source='weapon'){ if(!e||e.hp<=0||e.dead)return; if(e.finalBoss&&!isVisible(e))return; e.hp-=amount; damageTotals[weaponId]=(damageTotals[weaponId]||0)+amount; e.hitTextCd=(e.hitTextCd||0)-.033; if(e.hitTextCd<=0){addText(e.x,e.y-e.r,amount.toFixed(0));e.hitTextCd=.12;} if(e.hp<=0)kill(e,source); }
function addText(x,y,n){if(texts.length<40)texts.push({x,y,n,age:0})}
function burst(x,y,n=6){n=Math.min(n,8);if(particles.length>45)return;for(let i=0;i<n;i++){let a=Math.random()*6.28,s=25+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4})}}
function addXP(n){xp+=n*(1+stats.xpPct);while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.floor(S.xpBase*Math.pow(1.1,level-1));paused=true;showLevelUp();break}}
function stars(n,max=5){return '★'.repeat(Math.max(0,Math.min(max,n)))+'☆'.repeat(Math.max(0,max-n));}
function availableChoices(){
 const list=[];
 // New weapons first when not owned, otherwise allow star upgrades.
 for(const [id,w] of Object.entries(weapons)){
  if(w.lv<w.max){
   const title=w.lv===0?`🆕 ${w.name}`:`${w.name}`;
   const desc=w.lv===0?'새 무기 획득':(w.lv>=w.max?'최대 강화':`강화: ${stars(w.lv+1)}`);
   list.push({id,title,desc,kind:'weapon',stars:w.lv+1});
  }
 }
 for(const [id,s] of Object.entries(supports)){
  if(s.lv<s.max)list.push({id,title:s.name,desc:s.desc,kind:'support',stars:s.lv+1});
 }
 // 일반 성장 옵션도 유지. 단, 같은 효과가 보조무기와 겹치므로 선택지에는 보조무기와 함께 등장할 수 있다.
 if(stats.weaponSizePct<.5)list.push({id:'size',title:'무기 크기 +10%',desc:'모든 무기의 크기 +10%',kind:'stat',stars:Math.round(stats.weaponSizePct/.1)+1});
 // 최대 3개를 무작위로 뽑아 선택창이 과밀해지지 않도록 한다.
 for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 return list.slice(0,3);
}
function showLevelUp(){
 const box=document.getElementById('choices');box.innerHTML='';
 const opts=availableChoices();
 for(const o of opts){
  const b=document.createElement('button');b.className='choice';
  b.innerHTML=`<span class="stars">${stars(o.stars)}</span><span class="tag">${o.kind==='weapon'?'WEAPON':'SUPPORT'}</span>${o.title}<small>${o.desc}</small>`;
  b.onclick=()=>{applyChoice(o.id);document.getElementById('levelup').style.display='none';paused=false;last=performance.now();if(rafId)cancelAnimationFrame(rafId);rafId=requestAnimationFrame(loop)};
  box.appendChild(b)
 }
 document.getElementById('levelup').style.display='flex';
}
function applyChoice(id){
 if(weapons[id]){
  const w=weapons[id];
  if(w.lv>=w.max)return;
  w.lv++;
  if(id==='kunai'){w.count=1;w.pierce=Math.max(0,w.lv-1);w.cooldown=w.lv>=5?.2:.43;}
  if(id==='blades'){w.count=w.lv+2;w.active=w.lv>=5?Infinity:0;w.cool=0;}
  if(id==='lightning')w.count=w.lv;
  if(id==='rocket')w.count=(w.lv===1?1:w.lv===2?2:w.lv===3?2:w.lv===4?3:1);
  if(id==='fire')w.count=(w.lv===1?1:w.lv===2?2:w.lv===3?3:w.lv===4?4:7);
  if(id==='drill')w.count=w.lv>=5?1:w.lv;
  w.cool=0;
 }else if(supports[id]){
  const s=supports[id];
  if(s.lv>=s.max)return;
  s.lv++;
  if(id==='fuel')stats.weaponRangePct+=.10;
  else if(id==='ammo')stats.damagePct+=.10;
  else if(id==='scroll')stats.xpPct+=.08;
  else if(id==='armor')stats.damageReducePct+=.10;
  else if(id==='shoes')stats.movePct+=.10;
  else if(id==='thruster')stats.projectileSpeedPct+=.10;
  else if(id==='fitness'){
   const old=player.maxHp;player.maxHp*=1.20;player.hp=Math.min(player.maxHp,player.hp+(player.maxHp-old));
  }
  else if(id==='drink'){}
  else if(id==='cube'){}
  else if(id==='exo'){}
  else if(id==='magnet')stats.magnetPct+=1.0;
 }else if(id==='size')stats.weaponSizePct+=.10;
 updateWeaponsUI();
}

function updateWeaponsUI(){
 const a=Object.values(weapons).filter(w=>w.lv>0).map(w=>`${w.name} ${stars(w.lv)}`);
 const b=Object.values(supports).filter(x=>x.lv>0).map(x=>`${x.name} ${stars(x.lv,x.max)}`);
 document.getElementById('weaponList').textContent=a.join(' · ');
 document.getElementById('supportList').textContent=b.join(' · ');
 document.getElementById('pauseWeaponList').textContent=a.length?a.join(' · '):'없음';
 document.getElementById('pauseSupportList').textContent=b.length?b.join(' · '):'없음';
}

function drop(x,y,type){if(drops.length<24)drops.push({x,y,type,r:11,bob:Math.random()*6.28})}
function kill(e,source='normal'){
 if(e.dead||e.hp>0)return;
 if(e.finalBoss&&!isVisible(e))return;
 e.dead=true;
 score+=e.boss?250:10;killCount++;gems.push({x:e.x,y:e.y,r:6,xp:e.xp});
 if(e.boss){if(e.bossIndex===4)finalBossDefeated=true;gems.push({x:e.x+8,y:e.y,r:7,xp:e.xp});drop(e.x-22,e.y,'bomb');drop(e.x+22,e.y,'magnet');drop(e.x,e.y-20,'chest')}
 else if(Math.random()<.05)drop(e.x,e.y,['bomb','magnet','heal'][Math.floor(Math.random()*3)]);
 burst(e.x,e.y,e.boss?14:5);
}
function collectDrop(d){
 if(d.type==='bomb'){for(const e of enemies)if(e.hp>0){if(e.boss){if(e.finalBoss)continue;if(!isVisible(e))continue;e.hp=Math.max(0,e.hp-e.max*.05);addText(e.x,e.y-e.r,'-'+Math.ceil(e.max*.05));}else{e.hp=0;gems.push({x:e.x,y:e.y,r:6,xp:e.xp});kill(e,'bomb')}}}
 if(d.type==='magnet'){for(const g of gems)g.boost=5000}

 }

 for(const sh of shots){if(sh.bossBlast){if(sh.life<=0){sh.life=0;}else if(Math.hypot(player.x-sh.x,player.y-sh.y)<sh.r+player.r&&player.inv<=0){player.hp-=sh.damage*(1-stats.damageReducePct);player.inv=1;addText(player.x,player.y-player.r-8,'-'+Math.ceil(sh.damage));}}else if(sh.fireBottle){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle='#45c95a';ctx.strokeStyle='#17351d';ctx.lineWidth=2;const bs=1+stats.weaponSizePct;ctx.scale(bs,bs);ctx.fillRect(-5,-9,10,18);ctx.fillStyle='#a7e89b';ctx.fillRect(-3,-13,6,4);ctx.restore();}else if(sh.rocket){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle=sh.giant?'#ff3b30':'#ff7b21';ctx.beginPath();ctx.moveTo(sh.giant?17:11,0);ctx.lineTo(-8,-5);ctx.lineTo(-5,0);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd34e';ctx.fillRect(-12,-2,5,4);ctx.restore();}else if(sh.drill){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle='#c7d0d9';ctx.strokeStyle='#20242a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-9,-7);ctx.lineTo(-4,0);ctx.lineTo(-9,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}else if(sh.basicGun){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle='#d9dde3';ctx.strokeStyle='#30343b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(2,-3);ctx.lineTo(-7,-2);ctx.lineTo(-10,0);ctx.lineTo(-7,2);ctx.lineTo(2,3);ctx.closePath();ctx.fill();ctx.stroke();if(weapons.kunai.lv>=5){ctx.strokeStyle='#55aaff';ctx.lineWidth=3;ctx.stroke();}ctx.fillStyle='#5a606a';ctx.fillRect(-4,2,4,3);ctx.restore();}else{ctx.fillStyle='#f2c14e';ctx.fillRect(sh.x-4,sh.y-2,8,4);}}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.4);ctx.fillStyle='#f2c14e';ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.max(0,1-t.age/.8);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(t.n,t.x,t.y);}ctx.globalAlpha=1;drawPlayer();ctx.restore();
}

let rafId=0;
let fatalError=false;
function showFatalError(err){
  if(fatalError)return;
  fatalError=true;
  console.error('AI Survivor runtime error:',err);
  paused=true;
  const box=document.getElementById('gameover');
  document.getElementById('endTitle').textContent='게임 실행 오류';
  document.getElementById('result').textContent='게임 초기화 중 오류가 발생했습니다. 페이지를 새로고침해 주세요.';
  document.getElementById('damageResult').textContent='오류: '+(err&&err.message?err.message:String(err));
  box.classList.remove('win');
  box.style.display='flex';
}
function loop(t){
  if(over||paused||fatalError)return;
  try{
    const dt=Math.min(Math.max((t-last)/1000,0),.033);
    last=t;
    update(dt);
    draw();
    if(!over&&!paused&&!fatalError)rafId=requestAnimationFrame(loop);
  }catch(err){showFatalError(err);}
}
function joyMove(e){let x=e.clientX-joy.bx,y=e.clientY-joy.by,d=Math.hypot(x,y),m=42;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`}
function begin(e){if(paused||over||e.target.closest('button,.overlay'))return;joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';stick.style.display='block';joyMove(e)}
function end(e){if(!joy.on||e.pointerId!==joy.id)return;joy.on=false;joy.x=joy.y=0;stick.style.display='none';knob.style.transform='translate(0,0)'}
c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',e=>joy.on&&e.pointerId===joy.id&&joyMove(e));c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
function startGame(){
  if(gameStarted)return;
  if(rafId)cancelAnimationFrame(rafId);
  fatalError=false;
  document.getElementById('gameover').classList.remove('win');
  document.getElementById('gameover').style.display='none';
  reset();
  gameStarted=true;
  last=performance.now();
  rafId=requestAnimationFrame(loop);
}
document.getElementById('restart').onclick=()=>{
  if(rafId)cancelAnimationFrame(rafId);
  gameStarted=false;
  startGame();
};
document.getElementById('closeChest').onclick=()=>{chestPaused=false;document.getElementById('chestReward').style.display='none';paused=false;last=performance.now();if(rafId)cancelAnimationFrame(rafId);rafId=requestAnimationFrame(loop)};
function resumeGame(){
  paused=false;
  document.getElementById('pausePanel').style.display='none';
  document.getElementById('pauseBtn').textContent='Ⅱ';
  last=performance.now();
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
document.getElementById('pauseBtn').onclick=()=>{
  if(over||document.getElementById('levelup').style.display==='flex'||chestPaused)return;
  if(!paused){
    paused=true;
    updateWeaponsUI();
    document.getElementById('pausePanel').style.display='flex';
    document.getElementById('pauseBtn').textContent='▶';
    if(rafId)cancelAnimationFrame(rafId);
  }else resumeGame();
};
document.getElementById('resumeBtn').onclick=resumeGame;
setTimeout(startGame,0);
</script>
