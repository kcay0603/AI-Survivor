<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Survivor V4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:2px 2px #000}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:13px;gap:7px}
#bar{position:absolute;top:38px;left:12px;width:185px;height:14px;border:2px solid #111;background:#333}
#hp{height:100%;background:#e94b4b;width:100%}
#hpText{position:absolute;top:40px;left:18px;font-size:10px;font-weight:900}
#xpbar{position:absolute;top:57px;left:12px;width:185px;height:7px;background:#30343d;border:1px solid #111}
#xp{height:100%;width:0;background:#61d8ff}
#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;white-space:nowrap}
#stick{position:fixed;left:0;top:0;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:none;display:none;z-index:10}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff4;border:2px solid #fff6}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;pointer-events:auto;z-index:20;padding:18px}
#levelup h2{margin:0 0 5px;font-size:29px}
#choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
.choice{width:155px;padding:12px 8px;border:2px solid #fff5;border-radius:12px;background:#252b36;color:#fff;font-weight:900}
.choice small{display:block;margin-top:4px;font-weight:500;opacity:.72}
button{font-size:16px;font-weight:900;padding:11px 20px;border:0;border-radius:10px;background:#f2c14e;color:#111}
#gameover{z-index:30}.win{background:#07110de8}
#weaponList{font-size:11px;line-height:1.5;margin-top:5px;opacity:.85}
#supportList{font-size:10px;line-height:1.35;max-width:240px;opacity:.78;margin-top:2px}
#levelup .sub{margin:0 0 8px;font-size:12px;opacity:.75}
.choice{position:relative;min-height:112px}
.choice .stars{display:block;text-align:center;font-size:18px;letter-spacing:1px;line-height:20px;margin-bottom:3px;color:#ffd84d}
.choice .tag{display:inline-block;font-size:9px;padding:2px 5px;border-radius:6px;background:#151a22;opacity:.8;margin-bottom:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top"><span>LV <b id="lv">1</b></span><span>💎 <b id="gems">0</b></span><span>점수 <b id="score">0</b></span><span>⏱ <b id="time">0:00</b></span></div>
  <div id="bar"><div id="hp"></div></div><div id="hpText">100 / 100</div>
  <div id="xpbar"><div id="xp"></div></div>
  <div id="weaponList"></div><div id="supportList"></div>
  <div id="hint">화면 어디든 드래그 · 자동 공격</div>
</div>
<div id="stick"><div id="knob"></div></div>

<div id="levelup" class="overlay"><h2>LEVEL UP!</h2><p class="sub">무기 또는 보조무기를 선택하세요.</p><div id="choices"></div></div>

<div id="gameover" class="overlay"><h1 id="endTitle">GAME OVER</h1><p id="result"></p><button id="restart">다시 시작</button></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();

const S={maxHp:100,damage:12,monsterHp:20,contact:10,xpBase:40};
let player,enemies,shots,gems,drops,particles,texts,areaWarnings,areas,score,level,xp,xpNeed,time,spawnTimer,shotTimer,nextBoss,paused,over,won,last,walkTime,killCount;
const joy={on:false,id:null,bx:0,by:0,x:0,y:0};
let lightningSeq=[];
const weapons={
 kunai:{name:'쿠나이',lv:1,max:5,evo:false,count:1,damage:20,range:350,cooldown:.43,cool:0,pierce:0,baseDamage:20},
 blades:{name:'수호자',lv:0,max:5,evo:false,count:0,damage:35,range:100,duration:5,cooldown:3,cool:0,phase:0},
 lightning:{name:'번개 발사기',lv:0,max:5,evo:false,count:0,damage:68,range:300,cooldown:4,cool:0},
 rocket:{name:'로켓',lv:0,max:5,evo:false,count:0,damage:46,range:300,cooldown:3.5,cool:0},
 fire:{name:'화염병',lv:0,max:5,evo:false,count:0,damage:14,range:180,duration:5,cooldown:3,cool:0},
 drill:{name:'드릴샷',lv:0,max:5,evo:false,count:0,damage:22,range:Infinity,cooldown:2.5,cool:0}
};
const supports={
 fuel:{name:'고성능 연료',lv:0,max:5,desc:'모든 무기 범위 +10%'},
 ammo:{name:'고화력 탄약',lv:0,max:5,desc:'모든 무기 공격력 +10%'},
 scroll:{name:'닌자 스크롤',lv:0,max:5,desc:'EXP 획득량 +8%'},
 armor:{name:'부랑자의 갑옷',lv:0,max:5,desc:'받는 피해 -10%'},
 drink:{name:'에너지 드링크',lv:0,max:5,desc:'5초마다 최대 HP의 1% 회복'},
 cube:{name:'에너지 큐브',lv:0,max:5,desc:'모든 무기 쿨타임 -8%'},
 exo:{name:'외골격 갑옷',lv:0,max:5,desc:'지속형 무기 효과시간 +10%'},
 shoes:{name:'러닝화',lv:0,max:5,desc:'이동속도 +10%'},
 thruster:{name:'탄약 추진기',lv:0,max:5,desc:'투사체 속도 +10%'},
 fitness:{name:'피트니스 안내서',lv:0,max:5,desc:'최대 HP +20%, 증가분 회복'},
 magnet:{name:'탄력 자석',lv:0,max:3,desc:'아이템 획득 범위 +100%'}
};
let stats={damagePct:0,weaponRangePct:0,weaponSizePct:0,xpPct:0,damageReducePct:0,movePct:0,projectileSpeedPct:0,magnetPct:0,attackSpeedPct:0};
let healTimer=5;

const types=[
 {name:'slime',at:0,hp:1,speed:42,r:10,damage:1,xp:10,color:'#58d04b'},
 {name:'bat',at:120,hp:2.2,speed:63,r:11,damage:1.35,xp:20,color:'#8a55c7'},
 {name:'goblin',at:240,hp:4.5,speed:49,r:13,damage:1.75,xp:34,color:'#4fae50'},
 {name:'skeleton',at:360,hp:8,speed:53,r:14,damage:2.3,xp:52,color:'#e8dfc5'},
 {name:'ogre',at:480,hp:17,speed:29,r:20,damage:3.5,xp:90,color:'#b75b43'}
];
function unlockedTypes(){return types.filter(t=>time>=t.at)}
function chooseType(){
 const pool=types.filter(t=>time>=t.at);
 if(pool.length===1)return pool[0];
 const weights=pool.map((t,i)=>{
   const next=types[i+1]?.at ?? 540;
   const progress=Math.max(0,Math.min(1,(time-t.at)/Math.max(1,next-t.at)));
   return i===pool.length-1?1.9:Math.max(.03,1.15-progress*1.1);
 });
 if(time>=480)return pool[pool.length-1];
 let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;
 for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
 return pool[pool.length-1];
}

function reset(){
 player={x:0,y:0,r:12,hp:S.maxHp,maxHp:S.maxHp,speed:185,damage:S.damage,fireRate:.43,bulletSpeed:360,aimX:1,aimY:0,inv:0};
 enemies=[];shots=[];gems=[];drops=[];particles=[];texts=[];areaWarnings=[];areas=[];
 score=0;level=1;xp=0;xpNeed=S.xpBase;time=0;spawnTimer=.4;shotTimer=.1;nextBoss=90;paused=false;over=false;won=false;last=performance.now();walkTime=0;killCount=0;
 for(const w of Object.values(weapons)){w.lv=w===weapons.kunai?1:0;w.evo=false;w.count=w===weapons.kunai?1:0;w.cool=0;w.pierce=w===weapons.kunai?0:undefined}
 for(const s of Object.values(supports))s.lv=0;
 stats={damagePct:0,weaponRangePct:0,weaponSizePct:0,xpPct:0,damageReducePct:0,movePct:0,projectileSpeedPct:0,magnetPct:0,attackSpeedPct:0};
 lightningSeq=[];
 healTimer=5;
 document.getElementById('gameover').style.display='none';document.getElementById('levelup').style.display='none';
updateWeaponsUI();requestAnimationFrame(loop);
}
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,d=Math.max(W,H)/2+55;const t=chooseType();
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:t.r,hp:S.monsterHp*t.hp,max:S.monsterHp*t.hp,speed:t.speed+Math.min(35,level*1.5),type:t.name,contact:S.contact*t.damage, xp:t.xp,phase:Math.random()*6.28,boss:false});
}
function boss(kind){
 const names=['Crimson Brute','Azure Warden','Violet Reaper','Golden Titan','Final Overlord'];
 const a=Math.random()*6.28,d=Math.max(W,H)/2+100;
 const k=Math.min(kind,4),hp=S.monsterHp*(10+k*2.5);
 enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:25+k*2,hp,max:hp,speed:28+k*5,type:'boss'+k,contact:S.contact*2.2,xp:35+k*8,phase:0,boss:true,bossIndex:k,name:names[k],attackCd:2.5});
}
function fireGun(){
 const w=weapons.kunai;
 const baseRange=350;
 let t=null,b=baseRange*baseRange;
 for(const e of enemies){if(e.hp<=0)continue;const d=(e.x-player.x)**2+(e.y-player.y)**2;if(d<=b){b=d;t=e}}
 if(!t)return;
 const dx=t.x-player.x,dy=t.y-player.y,l=Math.hypot(dx,dy)||1;
 player.aimX=dx/l;player.aimY=dy/l;
 const speed=player.bulletSpeed*(1+stats.projectileSpeedPct);
 const size=w.lv>=5?1.25:1;
 shots.push({x:player.x+player.aimX*17,y:player.y+player.aimY*17,vx:player.aimX*speed,vy:player.aimY*speed,r:4*size,life:baseRange/speed,damage:w.baseDamage*(1+stats.damagePct),basicGun:true,pierce:Math.max(0,w.lv-1),hit:new Set()});
}

function addText(x,y,n){texts.push({x,y,n,age:0})}
function burst(x,y,n=6){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=25+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4})}}
function addXP(n){xp+=n*(1+stats.xpPct);while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.floor(S.xpBase*Math.pow(1.5,level-1));paused=true;showLevelUp();break}}
function stars(n,max=5){return '★'.repeat(Math.max(0,Math.min(max,n)))+'☆'.repeat(Math.max(0,max-n));}
function availableChoices(){
 const list=[];
 // New weapons first when not owned, otherwise allow star upgrades.
 for(const [id,w] of Object.entries(weapons)){
  if(w.lv<w.max){
   const title=w.lv===0?`🆕 ${w.name}`:`${w.name}`;
   const desc=w.lv===0?'새 무기 획득':(w.lv>=w.max?'최대 강화':`강화: ${stars(w.lv+1)}`);
   list.push({id,title,desc,kind:'weapon',stars:w.lv+1});
  }
 }
 for(const [id,s] of Object.entries(supports)){
  if(s.lv<s.max)list.push({id,title:s.name,desc:s.desc,kind:'support',stars:s.lv+1});
 }
 // 일반 성장 옵션도 유지. 단, 같은 효과가 보조무기와 겹치므로 선택지에는 보조무기와 함께 등장할 수 있다.
 if(stats.weaponSizePct<.5)list.push({id:'size',title:'무기 크기 +10%',desc:'모든 무기의 크기 +10%',kind:'stat',stars:Math.round(stats.weaponSizePct/.1)+1});
 // 최대 3개를 무작위로 뽑아 선택창이 과밀해지지 않도록 한다.
 for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 return list.slice(0,3);
}
function showLevelUp(){
 const box=document.getElementById('choices');box.innerHTML='';
 const opts=availableChoices();
 for(const o of opts){
  const b=document.createElement('button');b.className='choice';
  b.innerHTML=`<span class="stars">${stars(o.stars)}</span><span class="tag">${o.kind==='weapon'?'WEAPON':'SUPPORT'}</span>${o.title}<small>${o.desc}</small>`;
  b.onclick=()=>{applyChoice(o.id);document.getElementById('levelup').style.display='none';paused=false;last=performance.now();requestAnimationFrame(loop)};
  box.appendChild(b)
 }
 document.getElementById('levelup').style.display='flex';
}
function applyChoice(id){
 if(weapons[id]){
  const w=weapons[id];
  if(w.lv>=w.max)return;
  w.lv++;
  if(id==='kunai'){w.count=1;w.pierce=Math.max(0,w.lv-1);w.cooldown=w.lv>=5?.5:.43;}
  if(id==='blades')w.count=w.lv;
  if(id==='lightning')w.count=w.lv;
  if(id==='rocket')w.count=(w.lv===1?1:w.lv===2?2:w.lv===3?2:w.lv===4?3:1);
  if(id==='fire')w.count=(w.lv===1?1:w.lv===2?2:w.lv===3?3:w.lv===4?4:6);
  if(id==='drill')w.count=w.lv>=5?1:w.lv;
  w.cool=0;
 }else if(supports[id]){
  const s=supports[id];
  if(s.lv>=s.max)return;
  s.lv++;
  if(id==='fuel')stats.weaponRangePct+=.10;
  else if(id==='ammo')stats.damagePct+=.10;
  else if(id==='scroll')stats.xpPct+=.08;
  else if(id==='armor')stats.damageReducePct+=.10;
  else if(id==='shoes')stats.movePct+=.10;
  else if(id==='thruster')stats.projectileSpeedPct+=.10;
  else if(id==='fitness'){
   const old=player.maxHp;player.maxHp*=1.20;player.hp=Math.min(player.maxHp,player.hp+(player.maxHp-old));
  }
  else if(id==='drink'){}
  else if(id==='cube'){}
  else if(id==='exo'){}
  else if(id==='magnet')stats.magnetPct+=1.0;
 }else if(id==='size')stats.weaponSizePct+=.10;
 updateWeaponsUI();
}

function updateWeaponsUI(){
 const a=Object.values(weapons).filter(w=>w.lv>0).map(w=>`${w.name} ${stars(w.lv)}`);
 const b=Object.values(supports).filter(x=>x.lv>0).map(x=>`${x.name} ${stars(x.lv,x.max)}`);
 document.getElementById('weaponList').textContent=a.join(' · ');
 document.getElementById('supportList').textContent=b.join(' · ');
}

function drop(x,y,type){drops.push({x,y,type,r:11,bob:Math.random()*6.28})}
function kill(e,source='normal'){
 if(e.dead||e.hp>0)return;
 e.dead=true;
 score+=e.boss?250:10;killCount++;gems.push({x:e.x,y:e.y,r:6,xp:e.xp});
 if(e.boss){gems.push({x:e.x+8,y:e.y,r:7,xp:e.xp});drop(e.x-14,e.y,'bomb');drop(e.x+14,e.y,'magnet')}
 else if(Math.random()<.05)drop(e.x,e.y,['bomb','magnet','heal'][Math.floor(Math.random()*3)]);
 burst(e.x,e.y,e.boss?25:8);
}
function collectDrop(d){
 if(d.type==='bomb'){for(const e of enemies)if(e.hp>0){if(e.boss)e.hp*=.05;else{e.hp=0;gems.push({x:e.x,y:e.y,r:6,xp:e.xp});kill(e,'bomb')}}}
 if(d.type==='magnet'){for(const g of gems)g.boost=5000}
 if(d.type==='heal')player.hp=Math.min(player.maxHp,player.hp+15)
}
function weaponUpdate(dt){
 const rangeBonus=1+stats.weaponRangePct,sizeBonus=1+stats.weaponSizePct,damageBonus=1+stats.damagePct;
 for(const w of Object.values(weapons))w.cool-=dt;
 // 쿠나이는 기본 무기: 1발 + 별마다 관통 증가, 5성에서 쿨타임 0.5초
 if(weapons.kunai.lv>0){
   const k=weapons.kunai;
   if(shotTimer<=0){fireGun();shotTimer=k.cooldown;}
 }
 // 수호자: 5초 회전 후 3초 휴식. 5성은 무한 회전.
 const b=weapons.blades;
 if(b.lv){
   const active=b.duration*(1+supports.exo.lv*.10), cycle=b.lv>=5?active:active+b.cooldown, phase=time%cycle;
   if(b.lv>=5 || phase<active){
     const rad=b.range*rangeBonus,ang=time*2.8;
     for(let i=0;i<b.count;i++){
       const a=ang+i*6.283185/b.count,x=player.x+Math.cos(a)*rad,y=player.y+Math.sin(a)*rad,r=11*sizeBonus;
       for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<e.r+r){
         e.bladeCd=(e.bladeCd||0)-dt;
         if(e.bladeCd<=0){e.hp-=b.damage*damageBonus;addText(e.x,e.y-e.r,b.damage*damageBonus|0);e.bladeCd=.35;if(e.hp<=0)kill(e,'blade');}
       }
     }
   }
 }
 // 번개: 별 개수만큼 서로 다른 랜덤 대상에게 순차 타격. 첫 타격 순간부터 쿨타임 시작.
 const l=weapons.lightning;
 if(l.lv&&l.cool<=0&&lightningSeq.length===0)startLightningSequence();
 // 로켓
 const r=weapons.rocket;
 if(r.lv&&r.cool<=0){for(let i=0;i<r.count;i++)fireRocket(r,i,r.count);r.cool=r.cooldown*(1-0.08*supports.cube.lv);}
 // 화염병
 const f=weapons.fire;
 if(f.lv&&f.cool<=0){for(let i=0;i<f.count;i++)throwFire(f);f.cool=f.cooldown*(1-0.08*supports.cube.lv);}
 // 드릴샷
 const d=weapons.drill;
 if(d.lv&&d.cool<=0){for(let i=0;i<d.count;i++)fireDrill(d);d.cool=d.cooldown*(1-0.08*supports.cube.lv);}
}
function startLightningSequence(){
 const w=weapons.lightning, candidates=enemies.filter(e=>e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<=w.range*(1+stats.weaponRangePct));
 if(!candidates.length)return;
 const pool=[...candidates].sort(()=>Math.random()-.5);
 lightningSeq.push({remaining:w.count,pool,next:0,first:false});
}
function processLightning(dt){
 for(const q of lightningSeq){q.next-=dt;if(q.next>0)continue;
   let live=q.pool.filter(e=>e.hp>0); if(!live.length){q.remaining=0;continue;}
   const e=live[Math.floor(Math.random()*live.length)],w=weapons.lightning;
   const r=38*(1+stats.weaponRangePct)*(1+stats.weaponSizePct);
   areaWarnings.push({x:e.x,y:e.y,r,t:.08,damage:w.damage*(1+stats.damagePct),lightning:true,done:false});
   if(!q.first){q.first=true;w.cool=w.cooldown*(1-0.08*supports.cube.lv);}
   q.remaining--;q.next=.18;
 }
 lightningSeq=lightningSeq.filter(q=>q.remaining>0);
}

function nearestEnemy(maxRange=Infinity){let t=null,b=Infinity;for(const e of enemies){if(e.hp<=0)continue;const d=Math.hypot(e.x-player.x,e.y-player.y);if(d<=maxRange&&d<b){b=d;t=e}}return t}
function fireRocket(w,index=0,total=1){const t=nearestEnemy(w.range*(1+stats.weaponRangePct));if(!t)return;const base=Math.atan2(t.y-player.y,t.x-player.x);const spread=total>1?0.16:0;const a=base+(index-(total-1)/2)*spread;const spd=250*(1+stats.projectileSpeedPct),giant=w.lv>=5;shots.push({x:player.x+Math.cos(a)*14,y:player.y+Math.sin(a)*14,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:giant?14:6,life:Math.max(1,w.range/spd),damage:w.damage*(1+stats.damagePct)*(w.lv>=3&&w.lv<5?1.1:1),rocket:true,giant});}
function rocketExplosion(s){const r=(s.giant?58:40)*(1+stats.weaponRangePct)*(1+stats.weaponSizePct);burst(s.x,s.y,s.giant?28:16);for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-s.x,e.y-s.y)<r+e.r){e.hp-=s.damage;addText(e.x,e.y-e.r,s.damage.toFixed(0));if(e.hp<=0)kill(e,'rocket');}}
function lightning(){startLightningSequence();}

function throwFire(w){const ang=Math.random()*Math.PI*2,dist=Math.random()*w.range*(1+stats.weaponRangePct);const x=player.x+Math.cos(ang)*dist,y=player.y+Math.sin(ang)*dist;const spd=360*(1+stats.projectileSpeedPct);const a=Math.atan2(y-player.y,x-player.x);shots.push({x:player.x+Math.cos(a)*14,y:player.y+Math.sin(a)*14,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:7,life:Math.max(.18,dist/spd),damage:w.damage*(1+stats.damagePct),fireBottle:true,targetX:x,targetY:y});}
function fireDrill(w){
 const a=Math.atan2(player.aimY,player.aimX),spd=300*(1+stats.projectileSpeedPct);
 shots.push({x:player.x+player.aimX*16,y:player.y+player.aimY*16,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:8*(1+stats.weaponSizePct),life:10,damage:w.damage*(1+stats.damagePct),drill:true,bounces:0,hit:new Set(),homing:w.lv>=5});
}

function update(dt){
 if(paused||over)return;
 time+=dt;
 healTimer-=dt;if(healTimer<=0){healTimer=5;if(supports.drink.lv)player.hp=Math.min(player.maxHp,player.hp+player.maxHp*.01*supports.drink.lv);}
 if(time>=540){time=540;if(!enemies.some(e=>e.boss&&e.bossIndex===4))boss(4);}
 else if(time>=nextBoss){boss(Math.floor(nextBoss/90)-1);nextBoss+=90;}
 spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.10,.78-time*.0009-level*.006);}
 shotTimer-=dt;
 const moving=joy.on&&(Math.abs(joy.x)+Math.abs(joy.y)>.04),len=Math.hypot(joy.x,joy.y)||1;
 if(moving){player.x+=joy.x/len*player.speed*(1+stats.movePct)*dt;player.y+=joy.y/len*player.speed*(1+stats.movePct)*dt;walkTime+=dt*9}else walkTime+=dt*2;
 player.inv=Math.max(0,player.inv-dt);
 for(const e of enemies){
  if(e.hp<=0)continue;
  let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d<e.r+player.r+3){let push=(e.r+player.r+3-d)/d;e.x-=dx*push*.5;e.y-=dy*push*.5;}
  e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.phase+=dt*2;
  for(const o of enemies)if(o!==e&&o.hp>0){let ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy)||1,minD=e.r+o.r+2;if(od<minD){let p=(minD-od)/od*.5;e.x+=ox*p;e.y+=oy*p;}}
  if(e.boss){e.attackCd-=dt;if(e.attackCd<=0){e.attackCd=3-e.bossIndex*.2;areaWarnings.push({x:player.x,y:player.y,r:42+e.bossIndex*8,t:1,damage:e.contact,lightning:false,done:false});}}
  if(d<e.r+player.r&&player.inv<=0){player.hp-=e.contact*(1-stats.damageReducePct);player.inv=1;addText(player.x,player.y-player.r-8,'-'+Math.ceil(e.contact));burst(player.x,player.y,6);}
 }
 for(const a of areas){
   const pulse=.9+.1*Math.sin(time*10+a.phase), alpha=Math.min(1,a.life/a.maxLife+.25);
   ctx.save();ctx.globalAlpha=.28*alpha;ctx.fillStyle=a.blue?'#45b8ff':'#ff6a22';ctx.beginPath();ctx.arc(a.x,a.y,a.r*pulse,0,6.283);ctx.fill();
   ctx.globalAlpha=.95*alpha;ctx.strokeStyle=a.blue?'#8ee8ff':'#ff3b16';ctx.lineWidth=3;ctx.stroke();
   for(let i=0;i<6;i++){const ang=time*3+a.phase+i*1.047,rr=a.r*(.35+.18*Math.sin(time*8+i));ctx.globalAlpha=.75*alpha;ctx.fillStyle=a.blue?'#b9f2ff':'#ffd34e';ctx.beginPath();ctx.arc(a.x+Math.cos(ang)*rr,a.y+Math.sin(ang)*rr,3+2*Math.sin(time*9+i),0,6.283);ctx.fill();}
   ctx.restore();
 }
 for(const a of areaWarnings){a.t-=dt;if(a.t<=0&&!a.done){if(a.lightning){for(const e of enemies)if(e.hp>0&&!e.dead&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){e.hp-=a.damage;addText(e.x,e.y-e.r,a.damage.toFixed(0));if(e.hp<=0)kill(e,'lightning');}}else if(Math.hypot(player.x-a.x,player.y-a.y)<a.r+player.r&&player.inv<=0){player.hp-=a.damage*(1-stats.damageReducePct);player.inv=1;addText(player.x,player.y-player.r-8,'-'+Math.ceil(a.damage));}burst(a.x,a.y,a.lightning?18:14);a.done=true;}}
 areaWarnings=areaWarnings.filter(a=>!a.done);
 for(const sh of shots){
  sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;
  if(sh.fireBottle){if(sh.life<=0){areas.push({x:sh.targetX,y:sh.targetY,r:52*(1+stats.weaponRangePct)*(1+stats.weaponSizePct),life:weapons.fire.duration*(1+supports.exo.lv*.10),maxLife:weapons.fire.duration*(1+supports.exo.lv*.10),tick:0,damage:sh.damage,blue:weapons.fire.lv>=5,phase:Math.random()*6.28});burst(sh.targetX,sh.targetY,12);sh.life=0;}}
  else if(sh.drill){
   const left=player.x-W/2,right=player.x+W/2,top=player.y-H/2,bottom=player.y+H/2;
   if(sh.homing){
     let target=null,best=Infinity;
     for(const e of enemies){if(e.hp<=0)continue;const priority=e.boss?-100000:0,d=Math.hypot(e.x-sh.x,e.y-sh.y)+priority;if(d<best){best=d;target=e}}
     if(target){const tx=target.x-sh.x,ty=target.y-sh.y,l=Math.hypot(tx,ty)||1,spd=Math.hypot(sh.vx,sh.vy);sh.vx+=(tx/l*spd-sh.vx)*Math.min(1,dt*5);sh.vy+=(ty/l*spd-sh.vy)*Math.min(1,dt*5);}
   }else{
     if(sh.x<left||sh.x>right){sh.x=Math.max(left,Math.min(right,sh.x));sh.vx*=-1;}
     if(sh.y<top||sh.y>bottom){sh.y=Math.max(top,Math.min(bottom,sh.y));sh.vy*=-1;}
   }
   for(const e of enemies)if(e.hp>0&&Math.hypot(sh.x-e.x,sh.y-e.y)<sh.r+e.r&&!sh.hit.has(e)){sh.hit.add(e);e.hp-=sh.damage;addText(e.x,e.y-e.r,sh.damage.toFixed(0));if(e.hp<=0)kill(e,'drill');}
  }else{
   for(const e of enemies)if(e.hp>0&&Math.hypot(sh.x-e.x,sh.y-e.y)<sh.r+e.r&&!sh.hit.has(e)){
     sh.hit.add(e);
     if(sh.rocket){rocketExplosion(sh);sh.life=0;break;}
     e.hp-=sh.damage;addText(e.x,e.y-e.r,sh.damage.toFixed(0));
     if(e.hp<=0)kill(e,'gun');
     if(sh.basicGun&&sh.pierce>0){sh.pierce--;continue;}
     sh.life=0;break;
   }}
 }
 for(const a of areas){a.life-=dt;a.tick-=dt;if(a.tick<=0){a.tick=.4;for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-a.x,e.y-a.y)<a.r+e.r){e.hp-=a.damage;addText(e.x,e.y-e.r,a.damage.toFixed(0));if(e.hp<=0)kill(e,'fire');}}}
 areas=areas.filter(a=>a.life>0);
 weaponUpdate(dt);
 processLightning(dt);
 for(const e of enemies)if(e.hp<=0)kill(e);
 for(const g of gems){let dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy)||1;const magnetRange=20*(1+stats.magnetPct);if(g.boost>0){g.boost-=dt*1000;g.x+=dx/d*420*dt;g.y+=dy/d*420*dt;}else if(d<magnetRange){const pull=260+Math.max(0,magnetRange-d)*4;g.x+=dx/d*pull*dt;g.y+=dy/d*pull*dt;}if(d<player.r+g.r){addXP(g.xp);g.r=0;}}
 for(const d of drops)d.bob+=dt;
 for(const d of drops)if(Math.hypot(player.x-d.x,player.y-d.y)<player.r+d.r){collectDrop(d);d.r=0;}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
 for(const t of texts){t.age+=dt;t.y-=18*dt;}
 enemies=enemies.filter(e=>e.hp>0);shots=shots.filter(s=>s.life>0);gems=gems.filter(g=>g.r>0);drops=drops.filter(d=>d.r>0);particles=particles.filter(p=>p.life>0);texts=texts.filter(t=>t.age<.8);
 const final=enemies.find(e=>e.boss&&e.bossIndex===4);
 if(time>=540&&(!final||final.hp<=0)&&killCount>0&&!won){won=true;over=true;document.getElementById('endTitle').textContent='GAME CLEAR!';document.getElementById('result').textContent=`최종 보스를 처치했습니다! 점수 ${score}`;document.getElementById('gameover').classList.add('win');document.getElementById('gameover').style.display='flex';}
 if(player.hp<=0&&!won){over=true;document.getElementById('endTitle').textContent='GAME OVER';document.getElementById('result').textContent=`점수 ${score} · 레벨 ${level}`;document.getElementById('gameover').style.display='flex';}
 updateUI();
}

function updateUI(){
 lv.textContent=level;scoreEl.textContent=score;timeEl.textContent=`${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')}`;hp.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';hpText.textContent=`${Math.max(0,Math.ceil(player.hp))} / ${Math.ceil(player.maxHp)}`;xpEl.style.width=Math.min(100,xp/xpNeed*100)+'%';gemsEl.textContent=Math.floor(xp/10)
}
const lv=document.getElementById('lv'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),hp=document.getElementById('hp'),hpText=document.getElementById('hpText'),xpEl=document.getElementById('xp'),gemsEl=document.getElementById('gems');
function drawPlayer(){ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));let moving=joy.on&&(Math.abs(joy.x)+Math.abs(joy.y)>.04),bob=moving?Math.sin(walkTime)*1.4:0,leg=moving?Math.sin(walkTime)*3:0;ctx.fillStyle='#0008';ctx.fillRect(-10,9,20,4);ctx.fillStyle='#315d86';ctx.fillRect(-7+leg,5,5,7);ctx.fillRect(2-leg,5,5,7);ctx.fillStyle='#4c9ee8';ctx.fillRect(-11,-9+bob,22,16);ctx.fillStyle='#f3d19f';ctx.fillRect(-7,-15+bob,14,9);ctx.fillStyle='#20242a';ctx.fillRect((player.aimX>=0?5:-9),-12+bob,4,3);ctx.save();ctx.rotate(Math.atan2(player.aimY,player.aimX));ctx.fillStyle='#d9dde3';ctx.fillRect(6,-2,14,5);ctx.fillStyle='#555b65';ctx.fillRect(8,3,5,4);ctx.restore();ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));if(e.boss){const cols=['#a93445','#3872b9','#7543a9','#c4922e','#b83a2d'];ctx.fillStyle=cols[e.bossIndex];ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);ctx.fillStyle='#fff';ctx.fillRect(-9,-5,5,5);ctx.fillRect(4,-5,5,5);ctx.fillStyle='#222';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(e.name,0,-e.r-12);ctx.fillStyle='#222';ctx.fillRect(-35,-e.r-8,70,5);ctx.fillStyle='#e34b5a';ctx.fillRect(-35,-e.r-8,70*Math.max(0,e.hp/e.max),5)}else{const col={slime:'#69c44a',bat:'#7652a6',goblin:'#5f9c45',zombie:'#637d70',skeleton:'#eee3c6'}[e.type];ctx.fillStyle=col;ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);ctx.fillStyle='#20242a';ctx.fillRect(-5,-2,3,3);ctx.fillRect(2,-2,3,3)}ctx.restore()}
function draw(){
 ctx.fillStyle='#171b24';ctx.fillRect(0,0,W,H);const camX=player.x-W/2,camY=player.y-H/2;ctx.save();ctx.translate(-camX,-camY);
 ctx.fillStyle='#202632';for(let x=Math.floor(camX/32)*32;x<camX+W+32;x+=32)ctx.fillRect(x,camY,1,H);for(let y=Math.floor(camY/32)*32;y<camY+H+32;y+=32)ctx.fillRect(camX,y,W,1);
 for(const a of areaWarnings){ctx.globalAlpha=.24;ctx.fillStyle=a.lightning?'#8ed8ff':'#ff4455';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.283);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=a.lightning?'#e8f8ff':'#ff6677';ctx.lineWidth=2;ctx.stroke();if(a.lightning){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x-5,a.y-75);ctx.lineTo(a.x+5,a.y-45);ctx.lineTo(a.x-4,a.y-22);ctx.lineTo(a.x+4,a.y);ctx.stroke();}}
 for(const g of gems){const col=g.xp>=70?'#ff3b30':g.xp>=40?'#ff8a24':g.xp>=20?'#ffd52a':'#62d9ff';ctx.save();ctx.translate(g.x,g.y);ctx.rotate(.785);ctx.fillStyle=col;ctx.fillRect(-5,-5,10,10);ctx.restore();}
 for(const d of drops){const yy=d.y+Math.sin(d.bob)*2;ctx.save();ctx.translate(d.x,yy);if(d.type==='bomb'){ctx.fillStyle='#e33d45';ctx.beginPath();ctx.arc(0,2,10,0,6.283);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-2,-11,4,5);ctx.fillStyle='#ffd34e';ctx.fillRect(2,-14,6,3);}else if(d.type==='magnet'){ctx.strokeStyle='#4b8dff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI);ctx.stroke();ctx.fillStyle='#ef4444';ctx.fillRect(-11,-2,5,9);ctx.fillRect(6,-2,5,9);}else{ctx.fillStyle='#fff';ctx.fillRect(-9,-9,18,18);ctx.fillStyle='#e33d45';ctx.fillRect(-2,-8,4,16);ctx.fillRect(-8,-2,16,4);}ctx.restore();}
 if(weapons.blades.lv){const w=weapons.blades,active=w.duration*(1+supports.exo.lv*.10),cycle=active+w.cooldown,phase=time%cycle;if(w.lv>=5||phase<active){const rad=w.range*(1+stats.weaponRangePct),ang=time*2.8,br=11*(1+stats.weaponSizePct);for(let i=0;i<w.count;i++){const a=ang+i*6.283185/w.count,x=player.x+Math.cos(a)*rad,y=player.y+Math.sin(a)*rad;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=w.evo?'#ffdf4d':'#f4f7ff';ctx.strokeStyle='#20242a';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(0,0,br*.72,0,Math.PI*2);ctx.fill();ctx.stroke();
for(let k=0;k<4;k++){const aa=k*Math.PI/2;ctx.save();ctx.rotate(aa);ctx.beginPath();ctx.moveTo(br*.35,-br*.42);ctx.lineTo(br*1.15,0);ctx.lineTo(br*.35,br*.42);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
ctx.fillStyle='#20242a';ctx.beginPath();ctx.arc(0,0,br*.16,0,Math.PI*2);ctx.fill();ctx.restore();}}}
 for(const e of enemies)if(!e.dead)drawEnemy(e);
 for(const sh of shots){if(sh.fireBottle){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle='#45c95a';ctx.strokeStyle='#17351d';ctx.lineWidth=2;ctx.fillRect(-5,-9,10,18);ctx.fillStyle='#a7e89b';ctx.fillRect(-3,-13,6,4);ctx.restore();}else if(sh.rocket){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle=sh.giant?'#ff3b30':'#ff7b21';ctx.beginPath();ctx.moveTo(sh.giant?17:11,0);ctx.lineTo(-8,-5);ctx.lineTo(-5,0);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd34e';ctx.fillRect(-12,-2,5,4);ctx.restore();}else if(sh.drill){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(Math.atan2(sh.vy,sh.vx));ctx.fillStyle='#c7d0d9';ctx.strokeStyle='#20242a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-9,-7);ctx.lineTo(-4,0);ctx.lineTo(-9,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}else{ctx.fillStyle='#f2c14e';ctx.fillRect(sh.x-4,sh.y-2,8,4);}}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.4);ctx.fillStyle='#f2c14e';ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.max(0,1-t.age/.8);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(t.n,t.x,t.y);}ctx.globalAlpha=1;drawPlayer();ctx.restore();
}

function loop(t){if(over||paused)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
function joyMove(e){let x=e.clientX-joy.bx,y=e.clientY-joy.by,d=Math.hypot(x,y),m=42;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`}
function begin(e){if(paused||over||e.target.closest('button,.overlay'))return;joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';stick.style.display='block';joyMove(e)}
function end(e){if(!joy.on||e.pointerId!==joy.id)return;joy.on=false;joy.x=joy.y=0;stick.style.display='none';knob.style.transform='translate(0,0)'}
c.addEventListener('pointerdown',begin);c.addEventListener('pointermove',e=>joy.on&&e.pointerId===joy.id&&joyMove(e));c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
document.getElementById('restart').onclick=()=>{document.getElementById('gameover').classList.remove('win');reset()};
reset();
</script>
