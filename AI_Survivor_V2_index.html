<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Survivor V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:2px 2px #000}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:14px;gap:8px}
#bar{position:absolute;top:38px;left:12px;width:150px;height:12px;border:2px solid #111;background:#333}
#hp{height:100%;background:#e94b4b;width:100%}
#xpbar{position:absolute;top:52px;left:12px;width:150px;height:6px;background:#30343d;border:1px solid #111}
#xp{height:100%;width:0;background:#61d8ff}
#hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;opacity:.72;white-space:nowrap}
#stick{position:fixed;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#fff1;border:2px solid #fff3;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff4;border:2px solid #fff6}
#levelup{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;pointer-events:auto}
#levelup h2{margin:0 0 8px;font-size:30px}
#choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:340px}
.choice{width:145px;padding:14px 8px;border:2px solid #fff5;border-radius:12px;background:#252b36;color:#fff;font-weight:800}
.choice small{display:block;margin-top:5px;font-weight:500;opacity:.75}
#gameover{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;pointer-events:auto}
button{font-size:18px;font-weight:900;padding:12px 25px;border:0;border-radius:10px;background:#f2c14e;color:#111}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div id="top"><span>LV <b id="lv">1</b></span><span>💎 <b id="gems">0</b></span><span>점수 <b id="score">0</b></span><span>⏱ <b id="time">0</b></span></div>
 <div id="bar"><div id="hp"></div></div><div id="xpbar"><div id="xp"></div></div>
 <div id="hint">왼쪽 조이스틱을 드래그해서 이동 · 공격은 자동</div>
</div>
<div id="stick"><div id="knob"></div></div>

<div id="levelup">
 <h2>LEVEL UP!</h2><p>강화할 능력을 하나 선택하세요.</p>
 <div id="choices"></div>
</div>

<div id="gameover">
 <h1>GAME OVER</h1><p id="result"></p><button id="restart">다시 시작</button>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
let W,H,DPR,player,enemies,shots,gems,particles,damageTexts,score,level,xp,xpNeed,elapsed,spawnTimer,shotTimer,paused,over,nextBossAt;
const joy={x:0,y:0,on:false}, stick=document.getElementById('stick'),knob=document.getElementById('knob');

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

function reset(){
 player={x:0,y:0,r:12,hp:100,maxHp:100,speed:185,damage:12,fireRate:.43,bulletSpeed:360,magnet:70,inv:0};
 enemies=[];shots=[];gems=[];particles=[];damageTexts=[];score=0;level=1;xp=0;xpNeed=40;elapsed=0;spawnTimer=.5;shotTimer=.1;paused=false;over=false;nextBossAt=60;
 document.getElementById('gameover').style.display='none';document.getElementById('levelup').style.display='none';
 last=performance.now();requestAnimationFrame(loop);
}

// 20초마다 현재 몬스터의 기준 HP가 1.2배가 됩니다.
function currentMonsterHP(){
 return 20*Math.pow(1.2,Math.floor(elapsed/20));
}

function randomEdgePosition(distance=45){
 const a=Math.random()*Math.PI*2;
 return {x:player.x+Math.cos(a)*(Math.max(W,H)/2+distance),y:player.y+Math.sin(a)*(Math.max(W,H)/2+distance)};
}

function spawn(){
 const pos=randomEdgePosition();
 const hp=Math.round(currentMonsterHP()*10)/10;
 enemies.push({x:pos.x,y:pos.y,r:9+Math.random()*3,hp,max:hp,speed:42+Math.min(45,level*2.5),type:'slime',boss:false,contactDamage:10});
}

function spawnBoss(){
 const pos=randomEdgePosition(90);
 const hp=Math.round(currentMonsterHP()*10*10)/10;
 enemies.push({x:pos.x,y:pos.y,r:27,hp,max:hp,speed:30+Math.min(20,level),type:'boss',boss:true,contactDamage:22});
 burst(pos.x,pos.y,18);
}

function shoot(){
 if(!enemies.length)return;
 let t=null,best=Infinity;
 for(const e of enemies){let d=(e.x-player.x)**2+(e.y-player.y)**2;if(d<best){best=d;t=e}}
 if(!t)return;
 let dx=t.x-player.x,dy=t.y-player.y,d=Math.hypot(dx,dy)||1;
 shots.push({x:player.x,y:player.y,vx:dx/d*player.bulletSpeed,vy:dy/d*player.bulletSpeed,r:4,life:1.3,damage:player.damage});
}

function burst(x,y,n=5){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=25+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35})}
}

function addDamageText(x,y,damage){
 damageTexts.push({x:x+(Math.random()*12-6),y:y-18,vx:(Math.random()*16-8),vy:-28,damage:Math.round(damage*10)/10,age:0,delay:.8,fade:.55});
}

function addXP(n){
 xp+=n;
 if(xp>=xpNeed){xp-=xpNeed;xpNeed=Math.floor(xpNeed*1.28);level++;paused=true;showLevelUp()}
}

function showLevelUp(){
 const box=document.getElementById('choices');box.innerHTML='';
 const opts=[
  ['공격력 +25%','damage'],
  ['공격속도 +20%','rate'],
  ['이동속도 +15%','speed'],
  ['최대 체력 +20','hp']
 ];
 opts.sort(()=>Math.random()-.5).slice(0,3).forEach(o=>{
  const b=document.createElement('button');b.className='choice';b.innerHTML=o[0]+'<small>선택해서 강화</small>';
  b.onclick=()=>{
   if(o[1]==='damage')player.damage=Math.round(player.damage*1.25);
   if(o[1]==='rate')player.fireRate*=.8;
   if(o[1]==='speed')player.speed*=1.15;
   if(o[1]==='hp'){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+20)}
   document.getElementById('levelup').style.display='none';paused=false;last=performance.now();requestAnimationFrame(loop);
  };
  box.appendChild(b)
 });
 document.getElementById('levelup').style.display='flex';
}

function update(dt){
 if(paused||over)return;
 elapsed+=dt;

 // 1분마다 보스 1마리 등장
 if(elapsed>=nextBossAt){spawnBoss();nextBossAt+=60}

 spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.18,.75-level*.025)}
 shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=player.fireRate}

 let ax=joy.on?joy.x:0,ay=joy.on?joy.y:0;
 const len=Math.hypot(ax,ay)||1;
 player.x+=ax/len*player.speed*dt;
 player.y+=ay/len*player.speed*dt;
 player.inv=Math.max(0,player.inv-dt);

 for(const e of enemies){
  let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;
  if(d<e.r+player.r&&player.inv<=0){player.hp-=e.contactDamage;player.inv=.55;burst(player.x,player.y,7)}
 }

 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}
 for(const s of shots){
  if(s.life<=0)continue;
  for(const e of enemies){
   if(e.hp<=0)continue;
   if(Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){
    e.hp-=s.damage;s.life=0;burst(s.x,s.y,3);addDamageText(e.x,e.y-e.r,s.damage);
    if(e.hp<=0){
     score+=e.boss?200:10;
     gems.push({x:e.x,y:e.y,r:e.boss?10:6,v:0});
     burst(e.x,e.y,e.boss?22:8);
    }
    break
   }
  }
 }

 for(const g of gems){
  let dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy)||1;
  if(d<player.magnet){g.x+=dx/d*160*dt;g.y+=dy/d*160*dt}
  if(d<player.r+g.r){addXP(g.boss?50:10);g.r=0}
 }

 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 for(const d of damageTexts){
  d.age+=dt;
  d.x+=d.vx*dt;
  if(d.age<d.delay)d.y+=d.vy*dt;
 }

 enemies=enemies.filter(e=>e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<Math.max(W,H)*1.2+120);
 shots=shots.filter(s=>s.life>0);
 gems=gems.filter(g=>g.r>0);
 particles=particles.filter(p=>p.life>0);
 damageTexts=damageTexts.filter(d=>d.age<d.delay+d.fade);

 if(player.hp<=0){
  over=true;
  document.getElementById('result').textContent=`점수 ${score} · 레벨 ${level} · 생존 ${Math.floor(elapsed)}초`;
  document.getElementById('gameover').style.display='flex'
 }
 updateUI();
}

function updateUI(){
 document.getElementById('lv').textContent=level;
 document.getElementById('score').textContent=score;
 document.getElementById('gems').textContent=Math.floor(xp/10);
 document.getElementById('time').textContent=Math.floor(elapsed);
 document.getElementById('hp').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
 document.getElementById('xp').style.width=Math.min(100,xp/xpNeed*100)+'%';
}

function draw(){
 ctx.fillStyle='#171b24';ctx.fillRect(0,0,W,H);
 // 카메라는 항상 플레이어를 화면 정가운데에 둡니다.
 const camX=player.x-W/2,camY=player.y-H/2;

 ctx.save();
 ctx.translate(-camX,-camY);

 ctx.fillStyle='#202632';
 const grid=32;
 const startX=Math.floor(camX/grid)*grid;
 const endX=camX+W+grid;
 const startY=Math.floor(camY/grid)*grid;
 const endY=camY+H+grid;
 for(let x=startX;x<endX;x+=grid)ctx.fillRect(x,camY,1,H);
 for(let y=startY;y<endY;y+=grid)ctx.fillRect(camX,y,W,1);

 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle='#f2c14e';ctx.fillRect(Math.round(p.x-2),Math.round(p.y-2),4,4)}ctx.globalAlpha=1;

 for(const g of gems){
  ctx.fillStyle='#61d8ff';ctx.fillRect(Math.round(g.x-4),Math.round(g.y-5),8,10);
  ctx.fillStyle='#b9f2ff';ctx.fillRect(Math.round(g.x-1),Math.round(g.y-3),2,5)
 }

 for(const e of enemies){
  if(e.boss){
   // 보스 몬스터
   ctx.fillStyle='#8f3040';ctx.fillRect(Math.round(e.x-e.r),Math.round(e.y-e.r+7),Math.round(e.r*2),Math.round(e.r*2-7));
   ctx.fillStyle='#d34b58';ctx.fillRect(Math.round(e.x-e.r+5),Math.round(e.y-e.r),Math.round(e.r*2-10),14);
   ctx.fillStyle='#ffdf73';ctx.fillRect(Math.round(e.x-10),Math.round(e.y-4),5,5);ctx.fillRect(Math.round(e.x+5),Math.round(e.y-4),5,5);
   // 보스 HP 바
   const bw=64,bh=6,bx=e.x-bw/2,by=e.y-e.r-15;
   ctx.fillStyle='#1b1014';ctx.fillRect(Math.round(bx),Math.round(by),bw,bh);
   ctx.fillStyle='#e34b5a';ctx.fillRect(Math.round(bx),Math.round(by),Math.max(0,bw*e.hp/e.max),bh);
   ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('BOSS',Math.round(e.x),Math.round(by-2));
  }else{
   ctx.fillStyle='#69c44a';ctx.fillRect(Math.round(e.x-e.r),Math.round(e.y-e.r+3),Math.round(e.r*2),Math.round(e.r*2-3));
   ctx.fillStyle='#7fe35d';ctx.fillRect(Math.round(e.x-e.r+2),Math.round(e.y-e.r),Math.round(e.r*2-4),5);
   ctx.fillStyle='#172019';ctx.fillRect(Math.round(e.x-5),Math.round(e.y-2),3,3);ctx.fillRect(Math.round(e.x+2),Math.round(e.y-2),3,3);
  }
 }

 for(const d of damageTexts){
  let alpha=1;
  if(d.age>=d.delay)alpha=Math.max(0,1-(d.age-d.delay)/d.fade);
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeText(String(d.damage),Math.round(d.x),Math.round(d.y));
  ctx.fillText(String(d.damage),Math.round(d.x),Math.round(d.y));
 }
 ctx.globalAlpha=1;

 for(const s of shots){ctx.fillStyle='#f2c14e';ctx.fillRect(Math.round(s.x-3),Math.round(s.y-3),6,6)}

 ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));
 if(player.inv>0&&Math.floor(player.inv*15)%2===0)ctx.globalAlpha=.35;
 ctx.fillStyle='#4c9ee8';ctx.fillRect(-11,-9,22,19);
 ctx.fillStyle='#f3d19f';ctx.fillRect(-7,-13,14,9);
 ctx.fillStyle='#242831';ctx.fillRect(4,-10,4,3);
 ctx.fillStyle='#e8e8e8';ctx.fillRect(7,-2,13,5);
 ctx.restore();

 ctx.restore();
}

let last=0;
function loop(t){if(over||paused)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}

function joyMove(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y),m=42;
 if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`;
}
stick.addEventListener('pointerdown',e=>{joy.on=true;stick.setPointerCapture(e.pointerId);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(joy.on)joyMove(e)});
stick.addEventListener('pointerup',()=>{joy.on=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});
document.getElementById('restart').onclick=reset;
reset();
</script>
</body>
</html>
